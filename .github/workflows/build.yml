
name: Build GraphCalc

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Compile 3DS app
        run: make

      - name: Save 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: GraphCalc-3DS
          path: graphcalc.3dsx
